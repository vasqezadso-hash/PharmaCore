spring.application.name=PharmaCore

spring.datasource.url=jdbc:mysql://localhost:3306/pharmacore_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Gestion de sesion persistente entre pestanas del navegador
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.max-age=28800
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie