<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Detalle de Compra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Detalle de Compra')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('ordenes-compra')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">

            <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide" th:text="'ORDEN DE COMPRA #' + ${compra.idCompra}"></h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span th:text="${compra.estado}"
                              th:classappend="${compra.estado == 'RECIBIDA'} ? 'bg-emerald-100 text-emerald-700' : (${compra.estado == 'PENDIENTE'} ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700')"
                              class="inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold"></span>
                        <span class="text-xs text-slate-500" th:text="${(nombresProveedores.get(compra.idProveedor) ?: ('Proveedor #' + compra.idProveedor)) + ' — ' + (nombresEmpleados.get(compra.idEmpleado) ?: ('Empleado #' + compra.idEmpleado))}"></span>
                    </div>
                </div>
                <a th:href="@{/view/ordenes-compra}" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 transition-colors shadow-xs self-start sm:self-auto">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Volver a órdenes
                </a>
            </div>

            <div th:if="${mensaje}" class="bg-emerald-50 text-emerald-700 border border-emerald-200 p-4 mb-6 rounded-2xl text-xs sm:text-sm flex items-center gap-3">
                <svg class="w-5 h-5 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <span th:text="${mensaje}"></span>
            </div>
            <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 p-4 mb-6 rounded-2xl text-xs sm:text-sm flex items-center gap-3">
                <svg class="w-5 h-5 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span th:text="${error}"></span>
            </div>

            <div th:if="${compra.estado == 'PENDIENTE'}" class="flex gap-3 mb-6">
                <a th:href="@{/view/ordenes-compra/recibir/{id}(id=${compra.idCompra})}" class="bg-pharmacore-accent text-white px-4 py-2.5 rounded-xl text-xs font-semibold hover:opacity-90 transition-opacity inline-flex items-center gap-2 shadow-sm">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    <span>Recibir Compra</span>
                </a>
                <form th:action="@{/view/ordenes-compra/cancelar/{id}(id=${compra.idCompra})}" method="post">
                    <button type="submit" class="bg-red-50 border border-red-200 text-red-700 px-4 py-2.5 rounded-xl text-xs font-semibold hover:bg-red-100 transition-colors" onclick="return confirm('¿Cancelar esta orden de compra?');">Cancelar Orden</button>
                </form>
            </div>
            <div th:if="${compra.estado == 'RECIBIDA'}" class="bg-teal-50 border border-teal-200 rounded-2xl p-4 mb-6 text-xs text-teal-800 flex items-center gap-2">
                <svg class="w-4 h-4 text-teal-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <span>Esta compra ya fue recibida. Las líneas no pueden ser modificadas.</span>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6">
                <table class="w-full text-sm text-left">
                    <thead class="bg-pharmacore-dark text-white text-xs uppercase tracking-wider">
                    <tr>
                        <th class="p-4">Producto ID</th>
                        <th class="p-4">Cantidad</th>
                        <th class="p-4">Precio Unitario</th>
                        <th class="p-4">Subtotal</th>
                        <th th:if="${compra.estado == 'PENDIENTE'}" class="p-4 text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(detalles)}">
                        <td colspan="5" class="p-6 text-center text-slate-400 text-xs">Esta compra todavía no tiene productos.</td>
                    </tr>
                    <tr th:each="d : ${detalles}" class="border-b border-slate-100">
                        <td class="p-4 text-xs" th:text="${nombresProductos.get(d.idProducto) ?: ('Producto #' + d.idProducto)}"></td>
                        <td class="p-4 text-xs" th:text="${d.cantidad}"></td>
                        <td class="p-4 text-xs" th:text="${'$' + #numbers.formatDecimal(d.precioUnitario, 0, 'COMMA', 0, 'POINT')}"></td>
                        <td class="p-4 text-xs font-semibold" th:text="${'$' + #numbers.formatDecimal(d.subtotal, 0, 'COMMA', 0, 'POINT')}"></td>
                        <td th:if="${compra.estado == 'PENDIENTE'}" class="p-4 text-center">
                            <form th:action="@{/view/ordenes-compra/detalle/{id}/eliminar-linea/{idDetalle}(id=${compra.idCompra},idDetalle=${d.idDetalleCompra})}" method="post" class="inline">
                                <button type="submit" class="text-red-600 font-semibold hover:underline text-xs" onclick="return confirm('¿Quitar este producto de la compra?');">Quitar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="p-6 border-t border-slate-100 flex justify-end">
                    <div class="text-sm space-y-1 text-right">
                        <div>Subtotal: <span class="font-semibold" th:text="${'$' + #numbers.formatDecimal(compra.subtotal, 0, 'COMMA', 0, 'POINT')}"></span></div>
                        <div>Impuestos: <span class="font-semibold" th:text="${'$' + #numbers.formatDecimal(compra.impuestos, 0, 'COMMA', 0, 'POINT')}"></span></div>
                        <div class="text-pharmacore-dark font-bold text-base">Total: <span th:text="${'$' + #numbers.formatDecimal(compra.total, 0, 'COMMA', 0, 'POINT')}"></span></div>
                    </div>
                </div>
            </div>

            <div th:if="${compra.estado == 'PENDIENTE'}" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-7">
                <div class="flex items-center gap-2 mb-4">
                    <span class="w-2.5 h-2.5 rounded-full bg-pharmacore-accent"></span>
                    <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider">Agregar Producto a la Compra</h2>
                </div>
                <form th:action="@{/view/ordenes-compra/detalle/{id}/agregar-linea(id=${compra.idCompra})}" method="post" class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
                    <div class="sm:col-span-5">
                        <label class="block text-[11px] font-semibold text-slate-600 uppercase tracking-wider mb-1">Producto</label>
                        <select name="idProducto" class="w-full px-3.5 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-medium text-slate-800" required>
                            <option value="">Seleccione producto...</option>
                            <option th:each="p : ${productos}" th:value="${p.idProducto}" th:text="${p.nombreComercial}" th:attr="data-precio=${p.precioCompra}"></option>
                        </select>
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-[11px] font-semibold text-slate-600 uppercase tracking-wider mb-1">Cantidad</label>
                        <input type="number" name="cantidad" min="1" placeholder="Ej: 10" class="w-full px-3.5 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-bold text-slate-800 text-center" required>
                    </div>
                    <div class="sm:col-span-3">
                        <label class="block text-[11px] font-semibold text-slate-600 uppercase tracking-wider mb-1">Precio Unitario</label>
                        <input type="number" step="0.01" name="precioUnitario" placeholder="0.00" class="w-full px-3.5 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-medium" required>
                    </div>
                    <div class="sm:col-span-2">
                        <button type="submit" class="w-full px-4 py-2.5 rounded-xl text-xs font-semibold text-white bg-pharmacore-accent hover:opacity-90 transition-opacity cursor-pointer shadow-sm">+ Agregar</button>
                    </div>
                </form>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
