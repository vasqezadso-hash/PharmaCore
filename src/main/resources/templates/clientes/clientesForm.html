<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Formulario de Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pharmacore: {
                            bg: '#F7FAF9',
                            dark: '#004B4B',
                            darker: '#003939',
                            accent: '#006565',
                            text: '#1E1E1E'
                        }
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<!-- TOPBAR GLOBAL -->
<header th:replace="~{fragments/layout :: topbar('Gestión de Clientes')}"></header>

<!-- CONTENEDOR CENTRAL -->
<div class="flex flex-1 relative min-h-[calc(100vh-4rem)] bg-pharmacore-bg">

    <!-- OVERLAY MÓVIL -->
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>

    <!-- SIDEBAR GLOBAL -->
    <aside th:replace="~{fragments/layout :: sidebar('clientes')}"></aside>

    <!-- AREA PRINCIPAL -->
    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-5xl mx-auto w-full">

            <!-- ENCABEZADO -->
            <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide">
                        <span th:text="${cliente.id_cliente != null} ? 'EDITAR CLIENTE / PACIENTE' : 'REGISTRAR NUEVO CLIENTE / PACIENTE'"></span>
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-500">
                        Complete la información personal y antecedentes médicos del paciente.
                    </p>
                </div>
                <a th:href="@{/view/clientes}" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 transition-colors shadow-xs self-start sm:self-auto">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Volver al listado
                </a>
            </div>

            <form th:action="@{/view/clientes/save}" th:object="${cliente}" method="post" class="space-y-6">

                <input type="hidden" th:field="*{id_cliente}"/>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                    <!-- SECCIÓN 1: INFORMACIÓN PERSONAL -->
                    <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden flex flex-col p-6 sm:p-7">
                        <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-100">
                            <span class="w-2.5 h-2.5 rounded-full bg-pharmacore-accent"></span>
                            <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider">
                                Información Personal
                            </h2>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                    Nombre Completo *
                                </label>
                                <input type="text" th:field="*{nombreCompleto}" required placeholder="Ej: Juan Pérez"
                                       class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-medium text-slate-800">
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                        Tipo Documento *
                                    </label>
                                    <select th:field="*{tipoDocumento}" required
                                            class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-medium text-slate-800">
                                        <option value="CC">CC - Cédula</option>
                                        <option value="CE">CE - Extranjería</option>
                                        <option value="PASAPORTE">Pasaporte</option>
                                        <option value="TI">TI - Tarjeta de Identidad</option>
                                        <option value="NIT">NIT</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                        Número Documento *
                                    </label>
                                    <input type="text" th:field="*{numeroDocumento}" required placeholder="Ej: 1020304050"
                                           class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-mono">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                        Teléfono de Contacto
                                    </label>
                                    <input type="text" th:field="*{telefono}" placeholder="Ej: 3001234567"
                                           class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                        Fecha de Nacimiento
                                    </label>
                                    <input type="date" th:field="*{fechaNacimiento}"
                                           class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN 2: CONTACTO Y ANTECEDENTES MÉDICOS -->
                    <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden flex flex-col p-6 sm:p-7">
                        <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-100">
                            <span class="w-2.5 h-2.5 rounded-full bg-pharmacore-accent"></span>
                            <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider">
                                Contacto y Salud
                            </h2>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                    Correo Electrónico
                                </label>
                                <input type="email" th:field="*{correo}" placeholder="correo@ejemplo.com"
                                       class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                        EPS / Aseguradora
                                    </label>
                                    <input type="text" th:field="*{eps}" placeholder="Ej: Sura, Sanitas"
                                           class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                        Dirección de Residencia
                                    </label>
                                    <input type="text" th:field="*{direccion}" placeholder="Ej: Calle 10 # 20-30"
                                           class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                    Alergias o Antecedentes Médicos
                                </label>
                                <textarea th:field="*{alergias}" rows="3" placeholder="Indique si presenta alergias a medicamentos (penicilina, AINEs, etc.)..."
                                          class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all"></textarea>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- BOTONERA DE ACCIÓN -->
                <div class="flex items-center justify-end gap-3 pt-2">
                    <a th:href="@{/view/clientes}"
                       class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="px-6 py-2.5 rounded-xl text-xs font-semibold text-white bg-pharmacore-accent hover:opacity-90 transition-opacity cursor-pointer shadow-sm">
                        Guardar Cliente
                    </button>
                </div>

            </form>

        </main>

        <!-- FOOTER GLOBAL -->
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
