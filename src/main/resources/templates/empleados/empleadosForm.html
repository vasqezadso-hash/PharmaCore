<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Formulario de Empleado</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pharmacore: {
                            bg: '#F7FAF9',
                            dark: '#004B4B',
                            darker: '#003939',
                            accent: '#006565',
                            text: '#1E1E1E'
                        }
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<!-- TOPBAR GLOBAL -->
<header th:replace="~{fragments/layout :: topbar('Gestión de Empleados')}"></header>

<!-- CONTENEDOR CENTRAL -->
<div class="flex flex-1 relative min-h-[calc(100vh-4rem)] bg-pharmacore-bg">

    <!-- OVERLAY MÓVIL -->
    <div id="overlay" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR GLOBAL -->
    <aside th:replace="~{fragments/layout :: sidebar('empleados')}"></aside>

    <!-- AREA PRINCIPAL -->
    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-5xl mx-auto w-full pb-16">

            <!-- ENCABEZADO -->
            <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide"
                        th:text="${empleado.id_empleado != null} ? 'EDITAR EMPLEADO' : 'REGISTRAR NUEVO EMPLEADO'">
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-500">
                        Gestión de datos de personal, cargo laboral y credenciales de acceso al sistema.
                    </p>
                </div>
                <a th:href="@{/view/empleados}" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 transition-colors shadow-xs self-start sm:self-auto">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Volver al listado
                </a>
            </div>

            <!-- MENSAJES FLASH -->
            <div th:if="${mensaje}" class="mb-6 rounded-2xl bg-emerald-50 border border-emerald-200 p-4 text-emerald-800 text-xs sm:text-sm font-medium shadow-xs flex items-center gap-2">
                <svg class="w-5 h-5 text-emerald-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                <span th:text="${mensaje}"></span>
            </div>
            <div th:if="${error}" class="mb-6 rounded-2xl bg-red-50 border border-red-200 p-4 text-red-800 text-xs sm:text-sm font-medium shadow-xs flex items-center gap-2">
                <svg class="w-5 h-5 text-red-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/view/empleados/save}"
                  th:object="${empleado}"
                  method="post"
                  class="space-y-6"
                  novalidate>

                <input type="hidden" th:field="*{id_empleado}" />

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                    <!-- SECCIÓN 1: INFORMACIÓN PERSONAL -->
                    <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden flex flex-col p-6 sm:p-7">
                        <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-100">
                            <span class="w-2.5 h-2.5 rounded-full bg-pharmacore-accent"></span>
                            <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider">
                                Información Personal
                            </h2>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                    Nombre Completo *
                                </label>
                                <input type="text" th:field="*{nombre_completo}" required
                                       placeholder="Nombres y Apellidos"
                                       class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-medium text-slate-800">
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                        Tipo Documento *
                                    </label>
                                    <select th:field="*{tipo_documento}" required
                                            class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-medium text-slate-800">
                                        <option value="CC">CC - Cédula</option>
                                        <option value="CE">CE - Extranjería</option>
                                        <option value="PASAPORTE">Pasaporte</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                        Número Documento *
                                    </label>
                                    <input type="text" th:field="*{numero_documento}" required
                                           placeholder="Número de documento"
                                           class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-mono">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                        Teléfono Móvil
                                    </label>
                                    <input type="text" th:field="*{telefono}"
                                           placeholder="Ej: 3001234567"
                                           class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                        Dirección
                                    </label>
                                    <input type="text" th:field="*{direccion}"
                                           placeholder="Dirección de residencia"
                                           class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN 2: INFORMACIÓN LABORAL -->
                    <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden flex flex-col p-6 sm:p-7">
                        <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-100">
                            <span class="w-2.5 h-2.5 rounded-full bg-pharmacore-accent"></span>
                            <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider">
                                Información Laboral
                            </h2>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                    Correo Electrónico
                                </label>
                                <input type="email" th:field="*{correo}"
                                       placeholder="correo@ejemplo.com"
                                       class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                        Cargo *
                                    </label>
                                    <input type="text" th:field="*{cargo}" required
                                           placeholder="Ej: Farmacéutico, Regente"
                                           class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-medium text-slate-800">
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                        Salario Base *
                                    </label>
                                    <input type="number" step="0.01" th:field="*{salario}" required
                                           placeholder="0.00"
                                           class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-medium">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                    Estado Laboral *
                                </label>
                                <select th:field="*{estado}" required
                                        class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-medium text-slate-800">
                                    <option value="ACTIVO">ACTIVO</option>
                                    <option value="INACTIVO">INACTIVO</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN 3: CREDENCIALES DE ACCESO -->
                    <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden flex flex-col p-6 sm:p-7 lg:col-span-2">
                        <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-100">
                            <span class="w-2.5 h-2.5 rounded-full bg-pharmacore-accent"></span>
                            <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider">
                                Credenciales de Acceso al Sistema
                            </h2>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                    Nombre de Usuario *
                                </label>
                                <input type="text" th:field="*{usuario.username}" required
                                       placeholder="Ej: jperez"
                                       class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-medium text-slate-800">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                    Contraseña <span class="text-slate-400 font-normal" th:if="${empleado.id_empleado != null}">(Dejar vacía para conservar)</span>
                                </label>
                                <input type="password" name="password_hash"
                                       placeholder="••••••••"
                                       class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                    Rol Asignado *
                                </label>
                                <select th:field="*{usuario.rol.idRol}" required
                                        class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-medium text-slate-800">
                                    <option value="">Seleccione un rol...</option>
                                    <option th:each="r : ${roles}"
                                            th:value="${r.idRol}"
                                            th:text="${r.nombre}">
                                    </option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                                    Estado Usuario *
                                </label>
                                <select th:field="*{usuario.estado}" required
                                        class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-medium text-slate-800">
                                    <option th:each="e : ${T(com.pharmacore.pharmacore.model.Usuarios.EstadoUsuario).values()}"
                                            th:value="${e}" th:text="${e}">ACTIVO</option>
                                </select>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- BOTONERA DE ACCIÓN -->
                <div class="flex items-center justify-end gap-3 pt-2">
                    <a th:href="@{/view/empleados}"
                       class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="px-6 py-2.5 rounded-xl text-xs font-semibold text-white bg-pharmacore-accent hover:opacity-90 transition-opacity cursor-pointer shadow-sm">
                        Guardar Empleado
                    </button>
                </div>

            </form>

        </main>

        <!-- FOOTER GLOBAL -->
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
