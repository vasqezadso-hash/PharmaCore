<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Categoría</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pharmacore: {
                            bg: '#F7FAF9',
                            dark: '#004B4B',
                            darker: '#003939',
                            accent: '#006565',
                            text: '#1E1E1E'
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Categorías')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('categorias')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-xl mx-auto w-full">

            <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide"
                        th:text="${categoria.id_categoria == null ? 'NUEVA CATEGORÍA' : 'EDITAR CATEGORÍA'}">Categoría</h1>
                    <p class="text-xs sm:text-sm text-slate-500">Agrupación terapéutica para el catálogo de medicamentos.</p>
                </div>
                <a th:href="@{/view/categorias}" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 transition-colors shadow-xs self-start sm:self-auto">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Volver a categorías
                </a>
            </div>

            <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 p-4 mb-6 rounded-2xl text-xs sm:text-sm flex items-center gap-3">
                <svg class="w-5 h-5 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/view/categorias/save}" th:object="${categoria}" method="post" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6">

                <input type="hidden" th:field="*{id_categoria}" />

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Nombre de la Categoría *</label>
                    <input type="text" th:field="*{nombre}" placeholder="Ej: Analgésicos y Antipiréticos"
                           class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all font-medium text-slate-800" required>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Descripción</label>
                    <textarea th:field="*{descripcion}" rows="3" placeholder="Breve descripción de las indicaciones de esta categoría..."
                              class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all text-slate-700"></textarea>
                </div>

                <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
                    <a th:href="@{/view/categorias}" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">Cancelar</a>
                    <button type="submit" class="px-6 py-2.5 rounded-xl text-xs font-semibold text-white bg-pharmacore-accent hover:opacity-90 transition-opacity cursor-pointer shadow-sm">Guardar Categoría</button>
                </div>
            </form>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
